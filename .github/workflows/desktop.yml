name: Flutter desktop
on:
  push:
    branches: [main, 'codex/flutter-desktop-*']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libxkbcommon-dev libbz2-dev liblzma-dev zlib1g-dev xvfb
      - name: Stable Flutter and Rust
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.1
      - name: Dependencies
        run: flutter pub get
      - name: Rust, real FFI, widgets and analysis
        run: python scripts/desktop.py test
      - name: Portable core tests
        run: cargo test --locked -p gamehandler-core
      - name: Package native desktop
        run: python scripts/desktop.py package --release
      - name: Verify packaged native component and CLI
        run: python scripts/verify_desktop_bundle.py --release
      - name: Linux desktop integration
        if: runner.os == 'Linux'
        run: |
          export GAMEHANDLER_NATIVE_LIBRARY="$PWD/rust/target/debug/libgamehandler_desktop.so"
          xvfb-run -a flutter test integration_test/desktop_test.dart -d linux
      - name: macOS desktop integration
        if: runner.os == 'macOS'
        run: |
          export GAMEHANDLER_NATIVE_LIBRARY="$PWD/rust/target/debug/libgamehandler_desktop.dylib"
          flutter test integration_test/desktop_test.dart -d macos
      - name: Windows desktop integration
        if: runner.os == 'Windows'
        run: |
          export GAMEHANDLER_NATIVE_LIBRARY="$PWD/rust/target/debug/gamehandler_desktop.dll"
          flutter test integration_test/desktop_test.dart -d windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamehandler-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /NOCD packaging/windows/gamehandler.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: gamehandler-windows-installer
          path: dist/*setup.exe
          if-no-files-found: error
  flatpak:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libxkbcommon-dev libbz2-dev liblzma-dev zlib1g-dev flatpak flatpak-builder appstream-compose debugedit
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal
      - run: flutter pub get
      - name: Build, install and CLI smoke test
        run: scripts/build_flatpak.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamehandler-flatpak
          path: dist/*.flatpak
          if-no-files-found: error
