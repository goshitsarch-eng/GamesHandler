[package]
name = "gamehandler"
description = "A COSMIC game manager for Linux, for running Windows games through Wine and Proton."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gamehandler"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gamehandler-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }

# Pin libcosmic to an exact revision (DECISIONS D-04). libcosmic declares
# `iced` as a git submodule pointing at pop-os/iced branch `master`, a moving
# head with no SemVer promise: under a branch pin upstream could break this app
# without the app changing. Cargo initialises that submodule itself, so nothing
# is vendored or hand-rolled here (DECISIONS D-09).
#
# `wgpu` is deliberately absent from the feature list. DECISIONS D-11 ships the
# software renderer (iced_tiny_skia, libcosmic's default), which needs no GPU
# and no `/dev/dri` — that is what makes the Flatpak smoke test and a
# broken-GPU machine both work.
#
# `animated-image` is enabled for its *codec coverage*, not for animation
# (DECISIONS D-29, from ux.md §12.4): it is the only libcosmic feature that
# turns on `image/webp` and `image/gif`, and `copy_custom_cover` stores a
# user's `.webp` verbatim under that suffix (`covers.py:300-301`), including
# files the Python app already wrote to the shared data directory. libcosmic
# pins `image` with `ico`/`jpeg`/`png` only, so without this a `.webp` cover
# fails to decode. The extra cost is `dep:async-fs` plus GIF support, neither
# of which the app uses; the feature name is a misnomer here.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "a401af8b1c54a8abd393b8c5b7c8809402f83850", default-features = false, features = ["winit", "tokio", "wayland", "x11", "a11y", "xdg-portal", "animated-image"] }
ureq = { version = "3", features = ["platform-verifier"] }
# The portal file chooser (D-23) answers with `url::Url`; this is the crate
# that turns the answer into a path (`Url::to_file_path`). Already in the
# lockfile as ashpd's dependency, so this adds no new source to vendor.
url = "2"

# `crate::view::a11y` has to *name* the type `Widget::a11y_nodes` returns, and
# libcosmic does not re-export it: `A11yTree` comes from `iced_accessibility`,
# and `grep -rn 'pub use iced_accessibility' .` run at the pinned checkout's
# root returns exactly one line, `iced/core/src/lib.rs:68`, which re-exports
# `pub use iced_accessibility::id;` — the `Id` type only, not the tree.
# `iced` is re-exported (`src/lib.rs:151`) but its public surface never mentions
# `iced_accessibility`, so without this line an `a11y_nodes` override cannot be
# written in this crate at all (E0433, probed on all four plausible paths).
#
# This is not a second copy of anything: `iced_accessibility` is a *member* of
# the same libcosmic git repository as the `libcosmic` dependency above, so at
# one rev both resolve to the identical checkout path and cargo unifies them.
# `cargo tree -p gamehandler -i iced_accessibility` reports a single node
# (`iced_accessibility v0.1.0 (…/libcosmic-41009aea1d72760b/a401af8/iced/accessibility)`)
# and the only `Cargo.lock` change is the one line adding it to the
# `gamehandler` dependency list — no new package entry.
#
# It carries no feature of its own; the `a11y` feature on `libcosmic` above is
# what turns on `Widget::a11y_nodes` and `Event::A11y` in iced itself.
iced_accessibility = { git = "https://github.com/pop-os/libcosmic.git", rev = "a401af8b1c54a8abd393b8c5b7c8809402f83850" }

# The cover cache decodes covers itself, so that what it decodes is bounded
# (PERF-02). `crate::view::cover_cache`'s module docs carry the argument and the
# measurement; this line is the minimum that argument needs.
#
# # Why a decode in this crate at all
#
# The renderer decodes whatever it is handed at the source image's own size and
# retains it until the frame that stopped drawing it
# (`iced/tiny_skia/src/raster.rs:151-171`, `:232-237`), and its cache has no
# public surface this crate can bound — `Pipeline`'s `load`/`allocate` are
# private (`:138`, `:166`) and the only knob is `trim_cache`, which trims by
# "hit this frame". A cover handed over as `Handle::Path` is therefore decoded
# at 600×900 if that is what the file is, whatever the tile's size. Handing over
# `Handle::Rgba` moves the decode to the side that knows how big the box is.
#
# # The feature list is libcosmic's own, deliberately
#
# `default-features = false` and this exact set is the *union* of what the
# `libcosmic` dependency above already enables: its own
# `image = { version = "0.25.10", default-features = false, features = ["ico",
# "jpeg", "png"] }` (`Cargo.toml:139-143`) plus `image/gif`, `image/webp` and
# `image/png` from `animated-image` (`:26-33`). Cargo unifies features across
# the graph, so this changes no codec, pulls in no package that is not already
# built for `libcosmic`, and leaves `image`'s own defaults (bmp, exr, ff, hdr,
# pnm, qoi, tga, tiff, …) off — enabling *those* is what would add sources to
# vendor and time to the build. `cargo tree -p gamehandler -i image` reports a
# single node, and the only `Cargo.lock` change is one line adding `image` to
# the `gamehandler` dependency list.
#
# # Why not a crate of its own
#
# Nothing here is a new capability: the app already decodes these exact formats
# on this exact path, one layer down, through this exact crate. The choice is
# only *where* in the pipeline the decode happens, and the answer has to be the
# side that knows the drawn size.
image = { version = "0.25.10", default-features = false, features = [
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }

# The application's tests read the same reference files as core's, so they share
# core's oracles rather than keeping a second copy of the lexer (ARCH-13).
#
# This edge is **load-bearing, not a convenience**, and an earlier revision of
# this comment said the opposite and was wrong: it claimed core's own
# `[dev-dependencies]` on itself already turned the feature on here, so this was
# redundant. It is not. Cargo does not activate a dependency's dev-dependencies
# when that dependency is being built *for* someone else, so with this edge
# removed `cargo check -p gamehandler --tests` fails with `cannot find
# oracle_support in gamehandler_core` — measured, after the removal, not
# reasoned about. The two `gamehandler-core` lines in `cargo tree -e features`
# are the honest cost of that: one edge is the dependency, the other is the
# feature that has to be asked for by whoever needs it.
#
# A dev-dependency is still the right shape, and the reason is the one that
# matters for shipping: `cargo build` and `cargo build --release` exclude it, so
# no release binary links the module. `cargo tree -p gamehandler -e features
# --no-dev-dependencies` shows `default` alone.
[dev-dependencies]
gamehandler-core = { path = "../core", features = ["test-support"] }
