[package]
name = "gamehandler-core"
description = "GameHandler logic — models, settings, runners, installers, covers. No GUI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# HARD RULE (DECISIONS D-03, PLAN.md §3): this crate must never depend on
# libcosmic, iced, or any GUI crate — not even as a dev-dependency. That is
# what lets `cargo test -p gamehandler-core` run on a box with no display
# server and no GPU.
#
# For the same reason the port keeps the Python app's `progress_cb`
# convention: blocking work is a plain synchronous function taking
# `progress: &dyn Fn(f32)`, and the binary crate wraps it in `spawn_blocking`.
# Pulling an async runtime in here would make every logic test need a reactor.
[dependencies]
# serde/serde_json only. This is the complete dependency set the Python
# modules being ported here ever needed (`json` + `dataclasses` + `os` + `pathlib`),
# and keeping it that small is what makes `cargo test -p gamehandler-core`
# instant and headless.
serde = { version = "1", features = ["derive"] }

# `float_roundtrip` is REQUIRED, not an optimisation. serde_json's default f64
# parser is fast but not correctly rounded: measured against 20,000 realistic
# `time.time()` values, roughly 20% come back one ULP off. A one-ULP error is
# invisible in a UI and fatal to D-15 — the port would read a timestamp Python
# wrote and re-save different bytes, so every user's `games.json` would churn on
# every save. With the feature on, the parser is correctly rounded and the
# round trip is exact (0 mismatches in the same 20,000).
#
# Python's `float()` is correctly rounded, so this is what parity actually
# requires. The feature switches `de.rs` from `significand as f64` scaled by a
# `POW10` table (two roundings per value) onto `lexical::parse_concise_float`,
# and the difference is a hard one: of the 300 seeded timestamps in
# `docs/migration/oracle/fixtures/floats_roundtrip.in.json`, 58 (19.3%) come
# back one ULP off without it. `oracle_tests.rs` pins one of those values by
# name, so dropping this feature fails a test rather than a fixture review.
#
# `float_roundtrip` changes no API, which is exactly why it needs the fixture
# and the named value to hold it in place.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Runner archives (DECISIONS D-24). `core::runners::archive` streams an
# attacker-influenced tarball into private staging, and it is the one place in
# this crate where a defect is a vulnerability rather than a bug — so these are
# the reference C implementations, which have had a decade of adversarial
# attention, over younger pure-Rust ones. The allowlist's purpose was never "no
# dependencies": it is that `cargo test -p gamehandler-core` stays instant,
# headless and offline, and none of these compromise that.
#
# `flate2` is pinned to the `zlib` backend for the same reason: its default
# `miniz_oxide` is pure Rust but younger. The three C libraries are proven
# present in the 25.08 runtime at T-17; `bzip2` is the one to watch, because
# the SDK ships libbz2 and its headers but **no `bzip2.pc`**. That is not a
# failure, and it is worth stating because it reads like one: `bzip2-sys`'s
# `build.rs` consumes `pkg_config::probe("bzip2").is_ok()`, so a missing `.pc`
# falls through to `cc::Build` over the vendored `bzip2-1.0.8/*.c` — the
# documented-vendored path, chosen automatically. `lzma-sys` has the same
# `.is_ok()` shape for `liblzma`, so xz2 is safe for the same reason. There is
# no environment variable to set; an earlier draft of D-24 named one
# (`BZIP2_SYS_USE_PKG_CONFIG`) that does not exist.
tar = "0.4"
xz2 = "0.1"
bzip2 = "0.5"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
