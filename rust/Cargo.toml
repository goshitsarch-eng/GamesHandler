[package]
name = "gamehandler-desktop"
version = "0.9.0-alpha.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gamehandler-cli"
path = "src/main.rs"

[dependencies]
gamehandler-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"
